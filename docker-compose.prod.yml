version: '3.8'

# Production: dùng image đã build sẵn từ GHCR
# Không build lại trên server, chỉ pull image về và chạy

services:
  frontend:
    image: ghcr.io/${GHCR_REPO}/english-studio-frontend:${IMAGE_TAG:-latest}
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      - backend_js
      - backend_py
    environment:
      - NODE_ENV=production
      - API_URL=http://backend_js:5000
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-}

  backend_js:
    image: ghcr.io/${GHCR_REPO}/english-studio-backend-js:${IMAGE_TAG:-latest}
    ports:
      - "5000:5000"
    restart: unless-stopped
    volumes:
      - ./database:/app/database
    environment:
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET}
      - SUPABASE_URL=${SUPABASE_URL}
      - DB_PATH=/app/database/english_learning.db
      - AI_SERVICE_URL=http://backend_py:5001

  backend_py:
    image: ghcr.io/${GHCR_REPO}/english-studio-backend-py:${IMAGE_TAG:-latest}
    ports:
      - "5001:5001"
    restart: unless-stopped
    volumes:
      - ./database:/app/database
    environment:
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY}
      - DB_PATH=/app/database/english_learning.db
      - TRANSCRIPT_DB_PATH=/app/database/transcript_cache.db

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CF_TUNNEL_TOKEN}
    depends_on:
      - frontend
      - backend_js
