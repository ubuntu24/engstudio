name: English Studio - Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: production-deploy-main
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  GHCR_REPO: ${{ github.repository_owner }}/english-studio

jobs:
  # ============================================================
  # JOB 0: PR Security Check (chỉ chạy khi có Pull Request)
  # ============================================================
  pr-check:
    name: 🔐 PR Security Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Check for hardcoded secrets
        run: |
          FOUND=0
          if grep -rn "sk-[a-zA-Z0-9]\{20,\}" --include="*.py" --include="*.js" --include="*.ts" . 2>/dev/null; then
            echo "❌ OpenAI API key detected!"; FOUND=1
          fi
          [ $FOUND -eq 1 ] && exit 1 || echo "✅ No secrets detected"

  # ============================================================
  # JOB 1: Test & Build Check (chỉ chạy khi push lên main)
  # ============================================================
  test:
    name: 🧪 Test & Build Check
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend - Build check
        working-directory: frontend
        run: |
          npm ci
          npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5000

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Python - Syntax check
        working-directory: backend_py
        run: |
          pip install -r requirements.txt --quiet
          python -m py_compile app.py

  # ============================================================
  # JOB 2: Build & Push Docker Images lên GHCR (GitHub hosted) x
  # ============================================================
  build-and-push:
    name: 🐳 Build & Push Images
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ github.sha }}

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push backend-py
        uses: docker/build-push-action@v5
        with:
          context: ./backend_py
          push: true
          tags: |
            ghcr.io/${{ env.GHCR_REPO }}/english-studio-backend-py:${{ github.sha }}
            ghcr.io/${{ env.GHCR_REPO }}/english-studio-backend-py:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push backend-js
        uses: docker/build-push-action@v5
        with:
          context: ./backend_js
          push: true
          tags: |
            ghcr.io/${{ env.GHCR_REPO }}/english-studio-backend-js:${{ github.sha }}
            ghcr.io/${{ env.GHCR_REPO }}/english-studio-backend-js:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ env.GHCR_REPO }}/english-studio-frontend:${{ github.sha }}
            ghcr.io/${{ env.GHCR_REPO }}/english-studio-frontend:latest
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================
  # JOB 3: Deploy - chạy thẳng trên server (self-hosted runner)
  # Không cần SSH, runner đã ở trên server rồi!
  # ============================================================
  deploy:
    name: 🚀 Deploy to Production
    runs-on: self-hosted          # Runner cài trên server production
    needs: build-and-push
    environment: production

    steps:
      - uses: actions/checkout@v4
        with:
          clean: false

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Write .env
        env:
          GHCR_REPO: ${{ env.GHCR_REPO }}
          IMAGE_TAG: ${{ github.sha }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          FLASK_SECRET_KEY: ${{ secrets.FLASK_SECRET_KEY }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          CF_TUNNEL_TOKEN: ${{ secrets.CF_TUNNEL_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          printf 'GHCR_REPO=%s\n'           "$GHCR_REPO"           > .env
          printf 'IMAGE_TAG=%s\n'           "$IMAGE_TAG"           >> .env
          printf 'JWT_SECRET=%s\n'          "$JWT_SECRET"          >> .env
          printf 'FLASK_SECRET_KEY=%s\n'    "$FLASK_SECRET_KEY"    >> .env
          printf 'NEXT_PUBLIC_API_URL=%s\n' "$NEXT_PUBLIC_API_URL" >> .env
          printf 'CF_TUNNEL_TOKEN=%s\n'     "$CF_TUNNEL_TOKEN"     >> .env
          printf 'SUPABASE_URL=%s\n'        "$SUPABASE_URL"        >> .env
          printf 'GEMINI_API_KEY=%s\n'      "$GEMINI_API_KEY"      >> .env

      - name: Pull new images
        run: docker compose -f docker-compose.prod.yml pull

      - name: Restart containers
        run: docker compose -f docker-compose.prod.yml up -d --wait --remove-orphans

      - name: Print backend_py logs on failure
        if: failure()
        run: docker logs engstudio-backend_py-1 || true

      - name: Print backend_js logs on failure
        if: failure()
        run: docker logs engstudio-backend_js-1 || true

      - name: Prune old images
        if: always()
        run: docker image prune -f

      - name: Show status
        if: always()
        run: docker compose -f docker-compose.prod.yml ps

      - name: Cleanup .env
        if: always()
        run: rm -f .env
