version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:5000}
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      - backend_js
      - backend_py
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - API_URL=http://backend_js:5000

  backend_js:
    build:
      context: ./backend_js
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET}
      - SUPABASE_URL=${SUPABASE_URL}
      - AI_SERVICE_URL=http://backend_py:5001

  backend_py:
    build:
      context: ./backend_py
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY}
      - SUPABASE_URL=${SUPABASE_URL}
      - TRANSCRIPT_DB_PATH=/app/database/transcript_cache.db
    volumes:
      - ./database:/app/database
